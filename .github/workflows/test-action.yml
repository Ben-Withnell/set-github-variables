name: Test Action

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

    #            - name: Run tests
    #              run: npm test

    test-action-usage:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Print all environment variables
              run: printenv | sort

            - name: Print vars context
              run: echo "${{ toJSON(vars) }}"

            - name: Use set-github-variables action (marketplace)
              uses: Ben-Withnell/set-github-variables@v1.1.1
              env:
                  DEPLOY_CONTEXT: ${{ toJSON(vars) }}

            - name: Print all environment variables
              run: printenv | sort
